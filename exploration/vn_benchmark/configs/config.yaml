# Benchmark Config
dataset: 
  name: "ModelNet10"
  object_idx_limit: 100

# Numpy and Torch Seed
random_seed: 0

# Universal Object Settings
object_settings:
  number_views: &number_views 4
  min_angle: 0
  max_angle: 360
  number_points: 1000
  number_rendered_points: 250
  scaling_mode: &scaling_mode "rendering" # To enforce same number of points for all objects
  adapt_number_points: False
  verbose: False

# Rendering Settings
camera:
  scale: 1
  image_height: 500
  image_width: 500
  fx: 250
  fy: 250

# Object Collection Settings
epsilon: 0.5 #For Overlap Calculation , 10 meter rendering, 1m is 0.05
fps: True # Furthest Point Sampling
object_collection:
  number_collections: 100
  excluded_classes:
          # - "bed"
          # - "chair"
          # - "sofak"
          # - "table"

  object_collection_sampler:
    type: "interclass" # interclass, intraclass TODO: Add intraclass
    index_selection: "sequential" # random, sequential
        
  object_collection_settings:
    object_scaling_mode: *scaling_mode
    number_views: *number_views
    lhs_mode: "tracked" # scan, tracked, mesh
    rhs_mode: "mesh" # next_scan, mesh
    
# Plot Settings
plot_per_class: True
save_plots: True # Either Plot or Save
save_dir: "results/full_dataset_fps"


# NOTE: Currently idenetity rotation is used for all objects
